<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" aria-labelledby="t d">
  <title id="t">Fresh eyes from one AI</title>
  <desc id="d">The cupping table: four viewpoints by four methods. Each of five rounds uses three different pairs, and no pair repeats.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5B4636; }
    .h1 { font-size: 20px; font-weight: 700; fill: #3B2A20; }
    .sub { font-size: 13px; fill: #7A6656; }
    .name { font-size: 14px; font-weight: 700; fill: #3B2A20; }
    .small { font-size: 12px; fill: #7A6656; }
    .badge { font-size: 12.5px; font-weight: 700; }
    .axis { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #A08770; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="493" rx="16" fill="#FBF7F2" stroke="#E9DFD3"/>
  <text x="36" y="44" class="h1">Fresh eyes from one AI</text>
  <text x="36" y="66" class="sub">Each round, three new cuppers get one viewpoint and one method each. No pair repeats in five rounds.</text>
  <rect x="284" y="88" width="640" height="324" rx="10" fill="#FFFFFF" stroke="#E2D5C5"/>
  <text x="36" y="110" class="axis">VIEWPOINT ↓   METHOD →</text>
  <text x="364" y="114" class="name" text-anchor="middle">30 complaints</text>
  <text x="364" y="133" class="small" text-anchor="middle">up to 30 ways, run each</text>
  <text x="524" y="114" class="name" text-anchor="middle">Order sheet</text>
  <text x="524" y="133" class="small" text-anchor="middle">edge-case input table</text>
  <path d="M444 98V402" stroke="#F1E8DD"/>
  <text x="684" y="114" class="name" text-anchor="middle">Bad shot</text>
  <text x="684" y="133" class="small" text-anchor="middle">break a line on purpose</text>
  <path d="M604 98V402" stroke="#F1E8DD"/>
  <text x="844" y="114" class="name" text-anchor="middle">Blind tasting</text>
  <text x="844" y="133" class="small" text-anchor="middle">spec from code, compare</text>
  <path d="M764 98V402" stroke="#F1E8DD"/>
  <path d="M36 148H924" stroke="#EADFD2"/>
  <text x="36" y="177" class="name">Recipe check</text>
  <text x="36" y="196" class="small">is each criterion really true?</text>
  <text x="364" y="185" class="small" text-anchor="middle" style="fill:#C9B8A6">—</text>
  <rect x="486" y="167" width="76" height="28" rx="14" fill="#DDB68A"/>
  <text x="524" y="185.5" class="badge" text-anchor="middle" style="fill:#3B2A20">Round 2</text>
  <rect x="646" y="167" width="76" height="28" rx="14" fill="#C08552"/>
  <text x="684" y="185.5" class="badge" text-anchor="middle" style="fill:#2A1C14">Round 3</text>
  <rect x="806" y="167" width="76" height="28" rx="14" fill="#EED9BD"/>
  <text x="844" y="185.5" class="badge" text-anchor="middle" style="fill:#3B2A20">Round 1</text>
  <path d="M36 214H924" stroke="#EADFD2"/>
  <text x="36" y="243" class="name">Customer</text>
  <text x="36" y="262" class="small">real use, start to finish</text>
  <rect x="326" y="233" width="76" height="28" rx="14" fill="#C08552"/>
  <text x="364" y="251.5" class="badge" text-anchor="middle" style="fill:#2A1C14">Round 3</text>
  <rect x="486" y="233" width="76" height="28" rx="14" fill="#EED9BD"/>
  <text x="524" y="251.5" class="badge" text-anchor="middle" style="fill:#3B2A20">Round 1</text>
  <rect x="646" y="233" width="76" height="28" rx="14" fill="#5C3A21"/>
  <text x="684" y="251.5" class="badge" text-anchor="middle" style="fill:#FFFFFF">Round 5</text>
  <rect x="806" y="233" width="76" height="28" rx="14" fill="#8A5A36"/>
  <text x="844" y="251.5" class="badge" text-anchor="middle" style="fill:#FFFFFF">Round 4</text>
  <path d="M36 280H924" stroke="#EADFD2"/>
  <text x="36" y="309" class="name">Difficult customer</text>
  <text x="36" y="328" class="small">odd input, retries, races</text>
  <rect x="326" y="299" width="76" height="28" rx="14" fill="#EED9BD"/>
  <text x="364" y="317.5" class="badge" text-anchor="middle" style="fill:#3B2A20">Round 1</text>
  <rect x="486" y="299" width="76" height="28" rx="14" fill="#8A5A36"/>
  <text x="524" y="317.5" class="badge" text-anchor="middle" style="fill:#FFFFFF">Round 4</text>
  <rect x="646" y="299" width="76" height="28" rx="14" fill="#DDB68A"/>
  <text x="684" y="317.5" class="badge" text-anchor="middle" style="fill:#3B2A20">Round 2</text>
  <rect x="806" y="299" width="76" height="28" rx="14" fill="#5C3A21"/>
  <text x="844" y="317.5" class="badge" text-anchor="middle" style="fill:#FFFFFF">Round 5</text>
  <path d="M36 346H924" stroke="#EADFD2"/>
  <text x="36" y="375" class="name">Next barista</text>
  <text x="36" y="394" class="small">callers, existing data, migrations</text>
  <rect x="326" y="365" width="76" height="28" rx="14" fill="#DDB68A"/>
  <text x="364" y="383.5" class="badge" text-anchor="middle" style="fill:#3B2A20">Round 2</text>
  <rect x="486" y="365" width="76" height="28" rx="14" fill="#5C3A21"/>
  <text x="524" y="383.5" class="badge" text-anchor="middle" style="fill:#FFFFFF">Round 5</text>
  <rect x="646" y="365" width="76" height="28" rx="14" fill="#8A5A36"/>
  <text x="684" y="383.5" class="badge" text-anchor="middle" style="fill:#FFFFFF">Round 4</text>
  <rect x="806" y="365" width="76" height="28" rx="14" fill="#C08552"/>
  <text x="844" y="383.5" class="badge" text-anchor="middle" style="fill:#2A1C14">Round 3</text>
  <text x="36" y="452" class="sub">Every cupper is a new subagent that sees only the recipe and the code.</text>
  <text x="36" y="472" class="sub">A defect a round missed becomes a house note, and every later cupper reads the house notes first.</text>
</svg>
