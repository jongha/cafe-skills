<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="t d">
  <title id="t">What comes back</title>
  <desc id="d">A finished order, drawn as a cafe receipt: the order, the SERVE verdict for a size M order after 3 rounds, the cupping rounds, each acceptance criterion with the command that proves it, what changed, what is left for you, and what it assumed, left, and learned.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5B4636; }
    .h1 { font-size: 20px; font-weight: 700; fill: #3B2A20; }
    .sub { font-size: 13px; fill: #7A6656; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #3B2A20; }
    .shop { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
    .tag { font-size: 11.5px; letter-spacing: 1.5px; fill: #8C7462; }
    .ev { font-size: 11.5px; fill: #8C7462; }
    .b { font-weight: 700; }
    .ok { fill: #2E7D4F; }
    .bad { fill: #B23A3A; }
    .dim { fill: #8C7462; }
    .foot { font-size: 12px; font-style: italic; fill: #8C7462; }
    .label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; fill: #A08770; }
    .chip { font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #FFFFFF; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .ct { font-size: 14.5px; font-weight: 700; fill: #3B2A20; }
    .cl { font-size: 12.5px; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="789" rx="16" fill="#FBF7F2" stroke="#E9DFD3"/>
  <text x="36" y="44" class="h1">What comes back</text>
  <text x="36" y="66" class="sub">The work waits in your working tree, and a receipt tells you what is in it.</text>

  <!-- receipt paper -->
  <path d="M36 92H516V752L510 760L504 752L498 760L492 752L486 760L480 752L474 760L468 752L462 760L456 752L450 760L444 752L438 760L432 752L426 760L420 752L414 760L408 752L402 760L396 752L390 760L384 752L378 760L372 752L366 760L360 752L354 760L348 752L342 760L336 752L330 760L324 752L318 760L312 752L306 760L300 752L294 760L288 752L282 760L276 752L270 760L264 752L258 760L252 752L246 760L240 752L234 760L228 752L222 760L216 752L210 760L204 752L198 760L192 752L186 760L180 752L174 760L168 752L162 760L156 752L150 760L144 752L138 760L132 752L126 760L120 752L114 760L108 752L102 760L96 752L90 760L84 752L78 760L72 752L66 760L60 752L54 760L48 752L42 760L36 752Z" fill="#EADFD2" transform="translate(3 4)"/>
  <path d="M36 92H516V752L510 760L504 752L498 760L492 752L486 760L480 752L474 760L468 752L462 760L456 752L450 760L444 752L438 760L432 752L426 760L420 752L414 760L408 752L402 760L396 752L390 760L384 752L378 760L372 752L366 760L360 752L354 760L348 752L342 760L336 752L330 760L324 752L318 760L312 752L306 760L300 752L294 760L288 752L282 760L276 752L270 760L264 752L258 760L252 752L246 760L240 752L234 760L228 752L222 760L216 752L210 760L204 752L198 760L192 752L186 760L180 752L174 760L168 752L162 760L156 752L150 760L144 752L138 760L132 752L126 760L120 752L114 760L108 752L102 760L96 752L90 760L84 752L78 760L72 752L66 760L60 752L54 760L48 752L42 760L36 752Z" fill="#FFFFFF" stroke="#E2D5C5"/>
  <text x="276" y="124" class="m shop" text-anchor="middle">MR. LATTE'S CAFE</text>
  <text x="276" y="144" class="m tag" text-anchor="middle">ORDER UP · paginate-last-page</text>
  <path d="M60 162H492" stroke="#D8C9B8" stroke-dasharray="4 4"/>
  <text x="60" y="188" class="label">ORDER</text>
  <text x="164" y="188" class="m">show the last page in pagination</text>
  <text x="60" y="216" class="label">VERDICT</text>
  <rect x="164" y="201" width="62" height="22" rx="11" fill="#2E7D4F"/>
  <text x="195" y="216" class="chip" text-anchor="middle">SERVE</text>
  <text x="238" y="216" class="m">size M · 3 rounds · 6 cuppers</text>
  <path d="M60 238H492" stroke="#D8C9B8" stroke-dasharray="4 4"/>
  <text x="60" y="262" class="label">CUPPING</text>
  <text x="60" y="284" class="m b">R1</text>
  <text x="96" y="284" class="m"><tspan class="bad">2 P1 defects</tspan></text>
  <text x="492" y="284" class="m dim" text-anchor="end">fixed</text>
  <text x="60" y="304" class="m b">R2</text>
  <text x="96" y="304" class="m"><tspan class="bad">1 P1 defect</tspan></text>
  <text x="492" y="304" class="m dim" text-anchor="end">fixed, house note</text>
  <text x="60" y="324" class="m b">R3</text>
  <text x="96" y="324" class="m"><tspan class="ok">clean</tspan></text>
  <text x="492" y="324" class="m dim" text-anchor="end"><tspan class="ok">served</tspan></text>
  <text x="96" y="344" class="m dim">size M: 2 cuppers a round, 1 clean round serves</text>
  <path d="M60 364H492" stroke="#D8C9B8" stroke-dasharray="4 4"/>
  <text x="60" y="388" class="label">RECIPE</text>
  <text x="492" y="388" class="m ok b" text-anchor="end">3 of 3 PASS</text>
  <text x="60" y="412" class="m b">1</text>
  <text x="80" y="412" class="m">41 orders, 20 per page: page 3 shows #41</text>
  <text x="492" y="412" class="m ok b" text-anchor="end">PASS</text>
  <text x="80" y="430" class="m ev">$ npm test -- paginate  →  14 passed</text>
  <text x="60" y="456" class="m b">2</text>
  <text x="80" y="456" class="m">page count right for 0, 1, 20, 21, 41</text>
  <text x="492" y="456" class="m ok b" text-anchor="end">PASS</text>
  <text x="80" y="474" class="m ev">order sheet: 5 rows in paginate.test.ts</text>
  <text x="60" y="500" class="m b">3</text>
  <text x="80" y="500" class="m">no next link on the last page</text>
  <text x="492" y="500" class="m ok b" text-anchor="end">PASS</text>
  <text x="80" y="518" class="m ev">$ curl :3000/orders?page=3  →  no next</text>
  <path d="M60 540H492" stroke="#D8C9B8" stroke-dasharray="4 4"/>
  <text x="60" y="562" class="label">CHANGED</text>
  <text x="164" y="562" class="m">3 files, +41 −6, uncommitted</text>
  <text x="60" y="584" class="label">LEFT FOR YOU</text>
  <text x="164" y="584" class="m">commit and push</text>
  <text x="60" y="614" class="label">ASSUMED</text>
  <text x="164" y="614" class="m">past the end shows the last page, not 404</text>
  <text x="60" y="636" class="label">RISK P2</text>
  <text x="164" y="636" class="m">one extra COUNT query per page</text>
  <text x="60" y="658" class="label">NEXT ORDER</text>
  <text x="164" y="658" class="m">admin list has the same off-by-one</text>
  <text x="60" y="680" class="label">HOUSE NOTE</text>
  <text x="164" y="680" class="m">test totals that are not a full page</text>
  <path d="M60 702H492" stroke="#D8C9B8" stroke-dasharray="4 4"/>
  <text x="276" y="728" class="m foot" text-anchor="middle">No cup leaves the bar untasted.</text>

  <!-- callouts -->
  <path d="M516 212H537" stroke="#C9B8A6" stroke-dasharray="2 3"/>
  <circle cx="516" cy="212" r="3.5" fill="#C08552"/>
  <circle cx="548" cy="212" r="11" fill="#6F4E37"/><text x="548" y="216.5" class="num" text-anchor="middle">1</text>
  <text x="568" y="217" class="ct">The verdict</text>
  <text x="568" y="237" class="cl">Only cafe.py check can say SERVE.</text>
  <text x="568" y="255" class="cl">If the round limit passes without it, the receipt</text>
  <text x="568" y="273" class="cl">says CLOSE and lists the defects still open.</text>
  <path d="M516 302H537" stroke="#C9B8A6" stroke-dasharray="2 3"/>
  <circle cx="516" cy="302" r="3.5" fill="#C08552"/>
  <circle cx="548" cy="302" r="11" fill="#6F4E37"/><text x="548" y="306.5" class="num" text-anchor="middle">2</text>
  <text x="568" y="307" class="ct">Every round it took</text>
  <text x="568" y="327" class="cl">Fresh cuppers tasted it each round, as many</text>
  <text x="568" y="345" class="cl">as the size calls for. It ended on a clean round,</text>
  <text x="568" y="363" class="cl">not when the AI felt done.</text>
  <path d="M516 452H537" stroke="#C9B8A6" stroke-dasharray="2 3"/>
  <circle cx="516" cy="452" r="3.5" fill="#C08552"/>
  <circle cx="548" cy="452" r="11" fill="#6F4E37"/><text x="548" y="456.5" class="num" text-anchor="middle">3</text>
  <text x="568" y="457" class="ct">Proof for each criterion</text>
  <text x="568" y="477" class="cl">Every acceptance criterion with the command</text>
  <text x="568" y="495" class="cl">that proves it, run again on the finished work.</text>
  <path d="M516 571H537" stroke="#C9B8A6" stroke-dasharray="2 3"/>
  <circle cx="516" cy="571" r="3.5" fill="#C08552"/>
  <circle cx="548" cy="571" r="11" fill="#6F4E37"/><text x="548" y="575.5" class="num" text-anchor="middle">4</text>
  <text x="568" y="576" class="ct">Your call</text>
  <text x="568" y="596" class="cl">The change waits in your working tree. Commit,</text>
  <text x="568" y="614" class="cl">push, and deploy only happen if you ordered them.</text>
  <path d="M516 647H537" stroke="#C9B8A6" stroke-dasharray="2 3"/>
  <circle cx="516" cy="647" r="3.5" fill="#C08552"/>
  <circle cx="548" cy="647" r="11" fill="#6F4E37"/><text x="548" y="651.5" class="num" text-anchor="middle">5</text>
  <text x="568" y="652" class="ct">Written down, not asked</text>
  <text x="568" y="672" class="cl">Choices it made while you were away, flaws</text>
  <text x="568" y="690" class="cl">it left on purpose, ideas for a next order,</text>
  <text x="568" y="708" class="cl">and what it learned about your project.</text>
</svg>
